// autoexec.cfg - Apex Legends (Steam, PC)
// Values synced from Apex/local/settings.cfg, Apex/profile/profile.cfg, and sound_volume
// from Apex/local/videoconfig.txt on 2026-11-26 (Season 31 "Cipher", build R5pc_r5-310).
// How it works and what's left out: docs/autoexec.md

// Install: copy to C:\Program Files (x86)\Steam\steamapps\common\Apex Legends\cfg\autoexec.cfg
// Load:    Steam launch option +exec autoexec

// It runs at every launch, so a setting changed only in the in-game menu goes back
// to the value here at the next launch. Change it here as well.
// Not included: video settings (live in local read-only Apex/local/videoconfig.txt, which
// is not synced by Steam Cloud and persists across accounts on this PC), controller
// settings/binds, and per-account or game-managed state.

// --- Mouse -------------------------------------------------------------
// 800 CPI x 1.18 = 944 eDPI, about 44 cm/360 (yaw 0.022)
mouse_sensitivity "1.18"
mouse_use_per_scope_sensitivity_scalars "1"    // per-optic ADS multipliers below
mouse_zoomed_sensitivity_scalar_0 "1.303"
mouse_zoomed_sensitivity_scalar_1 "1.5"
mouse_zoomed_sensitivity_scalar_2 "1.5"
mouse_zoomed_sensitivity_scalar_3 "1.5"
mouse_zoomed_sensitivity_scalar_4 "1.5"
mouse_zoomed_sensitivity_scalar_5 "1.5"
mouse_zoomed_sensitivity_scalar_6 "1.5"
mouse_zoomed_sensitivity_scalar_7 "1.5"
m_acceleration "0"
m_invert_pitch "0"
m_clamp_to_window "0"

// --- Latency -----------------------------------------------------------
gfx_amdUseLowLatency "1"    // AMD Anti-Lag 2
gfx_nvnUseLowLatency "0"    // NVIDIA Reflex (NVIDIA GPUs only)
gfx_nvnUseLowLatencyBoost "0"    // NVIDIA Reflex Boost

// --- Field of view and camera ------------------------------------------
cl_fovScale "1.5"    // about 106 in the menu; 1.55 = 110
fov_disableAbilityScaling "1"
sprint_view_shake_style "1"
ziprail_roll_strength "1"

// --- Gameplay ----------------------------------------------------------
player_setting_autosprint "0"
player_setting_holdtosprint "1"
player_setting_stickysprintforward "0"
toggle_on_jump_to_deactivate "0"
toggle_on_jump_to_deactivate_changed "1"
mantle_boost_input_setting "1"
mantle_boost_ui_setting "1"
player_use_prompt_enabled "1"
player_setting_damage_closes_deathbox_menu "0"
player_setting_gamestateawareness_callouts "2"
player_setting_arsenals_maphudidentifiers "2"
player_setting_lowammo_setting "0"
player_setting_tutorialization "0"
weapon_setting_autocycle_on_empty "0"
cl_deathhints_enabled "1"

// --- HUD ---------------------------------------------------------------
net_netGraph2 "1"    // performance display
ui_layout_mode "0"
cl_safearea "0"
damage_indicator_style_pilot "1"
hud_setting_accessibleChat "0"
hud_setting_accolades_hudState "0"
hud_setting_accolades_tier_filter "0"
hud_setting_adsDof "0"
hud_setting_aind "0"
hud_setting_anonymousMode "0"
hud_setting_chainHeal "1"
hud_setting_compactOverHeadNames "1"
hud_setting_damageIndicatorStyle "2"
hud_setting_damageTextStyle "2"
hud_setting_energyAmmoDisplay "0"
hud_setting_minimapRotate "1"
hud_setting_observerFullmapAutoZoom "0"
hud_setting_pingAlpha "0.200000"
hud_setting_pingDoubleTapEnemy "1"
hud_setting_showButtonHints "0"
hud_setting_showCallsigns "1"
hud_setting_showEnemyHealthBar "1"
hud_setting_showEnemyHighlight "1"
hud_setting_showHopUpPopUp "0"
hud_setting_showLevelUp "1"
hud_setting_showMedals "0"
hud_setting_showMeter "1"
hud_setting_showObituary "1"
hud_setting_showOffscreenPortrait "1"
hud_setting_showTeamNamesOnMap "0"
hud_setting_showTips "1"
hud_setting_showWeaponFlyouts "1"
hud_setting_streamerMode "0"
party_color_enabled "0"

// --- Visual ------------------------------------------------------------
noise_filter_scale "0"    // film grain off
colorblind_mode "0"
reticle_color "255 0 255"    // magenta
laserSightColor "16711935"    // packed 24-bit RGB (0xFF00FF = 255 0 255)
laserSightColorCustomized "1"

// --- Audio -------------------------------------------------------------
sound_volume "0.600000"    // master volume (also setting.sound_volume in videoconfig.txt)
sound_num_speakers "2"    // 2 = stereo (headphones)
miles_channels "2"    // 2 = force 2-channel stereo (0 = Windows default)
miles_mix "1"
sound_volume_sfx "0.600000"
sound_volume_dialogue "0.300000"
sound_volume_music_game "0.200000"
sound_volume_music_lobby "0.200000"
sound_volume_sfx_observer "0.400000"
sound_musicReduced "0"
sound_without_focus "0"
cl_anim_always_play_nonlobby_sfx "1"
dialogue_cat_host_flavor "1"
dialogue_cat_host_important "1"
dialogue_cat_legend_flavor "1"
dialogue_cat_legend_important "1"
dialogue_cat_ping_flavor "1"
dialogue_cat_ping_important "1"
dialogue_cat_weapon_flavor "1"

// --- Voice and chat ----------------------------------------------------
voice_enabled "1"
sv_voiceenable "1"
voice_modenable "1"
VoiceChatMode "2"
voice_vox "1"
voice_scale "1"
voice_quiet_threshold "1300"
sound_volume_voice "0.800000"    // incoming voice volume
cl_comms_filter "-1"
hudchat_visibility "1"
hudchat_play_text_to_speech "0"
speechtotext_enabled "0"
rankedplay_voice_enabled "0"

// --- Subtitles ---------------------------------------------------------
closecaption "1"
cc_text_size "0"
cc_linger_time "1.0"
cc_predisplay_time "0.25"

// --- Other -------------------------------------------------------------
CrossPlay_user_optin "1"
rankedplay_display_enabled "0"
pin_opt_in "1"    // data collection opt-in
chroma_enable "0"    // Razer Chroma lighting

// --- Key binds (keyboard and mouse) ------------------------------------
// unbindall_ignoreGamepad clears keyboard/mouse binds first, so the result matches exactly
unbindall_ignoreGamepad
